name: AI Studio OS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Run AI Studio OS tests
        run: npm test

      - name: Run v1.3 Creative Engineering benchmark
        run: node ./bin/studio.mjs benchmark creative-engineering-v13

      - name: Run Brand Identity Kit benchmark
        run: node ./bin/studio.mjs benchmark brand-identity-kit-v1

      - name: Build The Creative Agency Command Center
        run: npm run build:web

      - name: Build v1.3 creative engineering fixture
        run: npm run build:creative-engineering

      - name: Install logo integrity renderer
        run: python -m pip install --disable-pip-version-check -r requirements-logo-integrity.txt

      - name: Run real SVG corruption suite
        run: npm run test:logo-integrity

  browser-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium only
        run: npx playwright install chromium

      - name: Run real browser runtime smoke test
        run: npm run test:browser-runtime

      - name: Run measured Command Center release smoke test
        run: npm run test:command-center

      - name: Produce Du Bonheur style-frame visual proof
        run: npm run proof:du-bonheur-style-frames

      - name: Produce Counter Ritual art-direction proof
        run: npm run proof:counter-ritual-art-direction

      - name: Produce The Conversation typography proof
        run: npm run proof:conversation-typography

      - name: Produce The Conversation typography finalist proof
        run: npm run proof:conversation-typography-refinement

      - name: Upload Du Bonheur style-frame proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: du-bonheur-style-frame-proof-v1
          path: artifacts/du-bonheur/style-frame-proof-v1
          if-no-files-found: error
          retention-days: 7

      - name: Upload Counter Ritual art-direction proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-ritual-art-direction-v2
          path: artifacts/du-bonheur/counter-ritual-art-direction-v2
          if-no-files-found: error
          retention-days: 7

      - name: Upload The Conversation typography proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-ritual-conversation-typography-v1
          path: artifacts/du-bonheur/counter-ritual-conversation-typography-v1
          if-no-files-found: error
          retention-days: 7

      - name: Upload The Conversation typography finalist proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-ritual-conversation-typography-refinement-v2
          path: artifacts/du-bonheur/counter-ritual-conversation-typography-refinement-v2
          if-no-files-found: error
          retention-days: 7

      - name: Upload Command Center release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-release-evidence
          path: artifacts/command-center
          if-no-files-found: ignore
          retention-days: 7
