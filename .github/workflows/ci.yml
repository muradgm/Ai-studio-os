name: AI Studio OS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Run AI Studio OS tests
        run: npm test

      - name: Check AI Council proof renderer syntax
        run: |
          node --check scripts/ai-council-ux-wireframe-proof.mjs
          node --check scripts/finalize-ai-council-ux-wireframe-proof.mjs
          node --check scripts/ai-council-style-frame-proof.mjs
          node --check scripts/finalize-ai-council-style-frame-proof.mjs
          node --check scripts/ai-council-canonical-ux-world-proof.mjs
          node --check scripts/ai-council-hybrid-v1-proof.mjs
          node --check scripts/ai-council-visual-system-v1-proof.mjs

      - name: Run v1.3 Creative Engineering benchmark
        run: node ./bin/studio.mjs benchmark creative-engineering-v13

      - name: Run Brand Identity Kit benchmark
        run: node ./bin/studio.mjs benchmark brand-identity-kit-v1

      - name: Run Typography Intelligence benchmark
        run: node ./bin/studio.mjs benchmark typography-intelligence-v01

      - name: Build The Creative Agency Command Center
        run: npm run build:web

      - name: Build v1.3 creative engineering fixture
        run: npm run build:creative-engineering

      - name: Install Playwright Chromium for logo integrity
        run: npx playwright install chromium

      - name: Run real SVG corruption suite
        run: npm run test:logo-integrity

  browser-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium only
        run: npx playwright install chromium

      - name: Render AI Council canonical UX wireframe proof
        run: npm run proof:ai-council-ux

      - name: Upload AI Council UX architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-ux-wireframe-proof-v1
          path: artifacts/ai-council/ux-wireframe-proof-v1
          if-no-files-found: error
          retention-days: 14

      - name: Render AI Council Style Frame Proof V2
        run: npm run proof:ai-council

      - name: Upload AI Council style-frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-style-frame-proof-v2
          path: artifacts/ai-council/style-frame-proof-v2
          if-no-files-found: error
          retention-days: 14

      - name: Render AI Council canonical 8 × 3 Creative World proof
        run: npm run proof:ai-council-worlds

      - name: Upload AI Council canonical Creative World evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-canonical-interface-world-proof-v1
          path: artifacts/ai-council/canonical-interface-world-proof-v1
          if-no-files-found: error
          retention-days: 14

      - name: Render AI Council Decision Spine versus Hybrid V1 proof
        run: npm run proof:ai-council-hybrid

      - name: Upload AI Council Hybrid V1 head-to-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-hybrid-v1-head-to-head-proof
          path: artifacts/ai-council/hybrid-v1-head-to-head-proof
          if-no-files-found: error
          retention-days: 14

      - name: Render AI Council Visual System V1 canonical and stress proof
        run: npm run proof:ai-council-visual-system

      - name: Upload AI Council Visual System V1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-visual-system-v1-proof
          path: artifacts/ai-council/visual-system-v1-proof
          if-no-files-found: error
          retention-days: 14

      - name: Run real typography browser proof
        run: npm run test:typography-browser

      - name: Run real browser runtime smoke test
        run: npm run test:browser-runtime

      - name: Run measured Command Center release smoke test
        run: npm run test:command-center

      - name: Upload Command Center release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-release-evidence
          path: artifacts/command-center
          if-no-files-found: ignore
          retention-days: 7
